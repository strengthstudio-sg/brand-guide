<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Grainient — Basalt</title>
<style>
  html, body {
    margin: 0; padding: 0; height: 100%; width: 100%;
    background: #0a0a0a;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: auto;
  }
  #grainient {
    position: relative;
    width: 100vw;
    height: 100vh;
    flex-shrink: 0;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
  }
  #grainient.sized { box-shadow: 0 20px 60px rgba(0,0,0,0.6); }
  #grainient canvas { display: block; width: 100%; height: 100%; }
  #size-label {
    position: absolute;
    bottom: -1.75rem;
    left: 50%;
    transform: translateX(-50%);
    color: rgba(255,255,255,0.5);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    font-size: 12px;
    font-variant-numeric: tabular-nums;
    letter-spacing: 0.05em;
    display: none;
  }
  #grainient.sized #size-label { display: block; }
  .content {
    position: absolute;
    inset: 0;
    z-index: 1;
    color: #fff;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 2rem;
    transition: opacity 0.2s;
  }
  .content.hidden { opacity: 0; pointer-events: none; }

  /* Hover zone in top-right — reveals settings UI */
  #settings-zone {
    position: fixed;
    top: 0;
    right: 0;
    width: 340px;
    height: 100vh;
    z-index: 10;
    pointer-events: none;
  }
  #settings-toggle, #settings-panel {
    pointer-events: auto;
    opacity: 0;
    transition: opacity 0.25s;
  }
  #settings-zone:hover #settings-toggle,
  #settings-zone:hover #settings-panel,
  #settings-panel.open,
  #settings-toggle:focus,
  #settings-toggle.pinned { opacity: 1; }

  #settings-toggle {
    position: absolute;
    top: 1rem;
    right: 1rem;
    width: 40px;
    height: 40px;
    border-radius: 50%;
    border: 1px solid rgba(255,255,255,0.3);
    background: rgba(0,0,0,0.4);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    color: #fff;
    font-size: 18px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  #settings-toggle:hover { background: rgba(0,0,0,0.6); }

  #settings-panel {
    position: absolute;
    top: 4rem;
    right: 1rem;
    width: 260px;
    padding: 1rem 1.25rem 1.25rem;
    background: rgba(0,0,0,0.55);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 12px;
    color: #fff;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    font-size: 13px;
    display: none;
  }
  #settings-panel.open { display: block; }
  #settings-panel h3 {
    margin: 0 0 0.75rem;
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    opacity: 0.7;
    font-weight: 500;
  }
  .row { margin-bottom: 0.9rem; }
  .row label {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 0.35rem;
    opacity: 0.85;
  }
  .row label .val { font-variant-numeric: tabular-nums; opacity: 0.6; font-size: 12px; }
  .row input[type=range] { width: 100%; accent-color: #fff; }
  .colors { display: flex; gap: 0.5rem; }
  .colors .swatch { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 0.3rem; }
  .colors .swatch span { font-size: 11px; opacity: 0.7; }
  .colors input[type=color] {
    width: 100%;
    height: 34px;
    border: 1px solid rgba(255,255,255,0.2);
    border-radius: 6px;
    background: transparent;
    cursor: pointer;
    padding: 2px;
  }
  .toggle-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 0.5rem 0;
    border-top: 1px solid rgba(255,255,255,0.1);
    margin-top: 0.5rem;
  }
  .toggle-row button {
    background: rgba(255,255,255,0.1);
    border: 1px solid rgba(255,255,255,0.2);
    color: #fff;
    padding: 4px 10px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 12px;
  }
  .toggle-row button:hover { background: rgba(255,255,255,0.2); }
</style>
</head>
<body>
<div id="grainient">
  <div class="content" id="content">
    <div>
      <h1 style="font-size: clamp(2rem, 6vw, 5rem); margin: 0; font-weight: 500; letter-spacing: -0.02em;">Basalt</h1>
      <p style="opacity: 0.85; margin-top: 1rem;">Full-viewport animated gradient background.</p>
    </div>
  </div>
  <div id="size-label">1080 × 1080</div>
</div>

<div id="settings-zone">
  <button id="settings-toggle" title="Settings">⚙</button>
  <div id="settings-panel">
    <h3>Canvas size</h3>
    <div class="row">
      <select id="sizePreset" style="width:100%; padding:6px 8px; background:rgba(255,255,255,0.08); color:#fff; border:1px solid rgba(255,255,255,0.2); border-radius:6px; font-size:13px;">
        <option value="fit">Fit window</option>
        <optgroup label="Instagram">
          <option value="1080x1080">IG Square — 1080 × 1080</option>
          <option value="1080x1350">IG Portrait — 1080 × 1350</option>
          <option value="1080x1920">IG Story / Reel — 1080 × 1920</option>
          <option value="1080x566">IG Landscape — 1080 × 566</option>
        </optgroup>
        <optgroup label="Facebook">
          <option value="1200x630">FB Feed — 1200 × 630</option>
          <option value="1080x1920">FB Story — 1080 × 1920</option>
          <option value="820x312">FB Cover — 820 × 312</option>
          <option value="1200x1200">FB Square — 1200 × 1200</option>
        </optgroup>
      </select>
    </div>

    <h3 style="margin-top: 1.1rem;">Colors</h3>
    <div class="colors">
      <label class="swatch"><input type="color" id="c1" value="#3f655b"><span>Color 1</span></label>
      <label class="swatch"><input type="color" id="c2" value="#6c938b"><span>Color 2</span></label>
      <label class="swatch"><input type="color" id="c3" value="#9eb9b3"><span>Color 3</span></label>
    </div>

    <h3 style="margin-top: 1.1rem;">Noise & Grain</h3>
    <div class="row">
      <label>Grain amount <span class="val" id="grainAmountVal">0.09</span></label>
      <input type="range" id="grainAmount" min="0" max="0.5" step="0.01" value="0.09">
    </div>
    <div class="row">
      <label>Grain scale <span class="val" id="grainScaleVal">2.0</span></label>
      <input type="range" id="grainScale" min="0.5" max="10" step="0.1" value="2">
    </div>
    <div class="row">
      <label>Noise scale <span class="val" id="noiseScaleVal">2.0</span></label>
      <input type="range" id="noiseScale" min="0.1" max="10" step="0.1" value="2">
    </div>

    <div class="toggle-row">
      <span>Overlay text</span>
      <button id="overlay-toggle">Hide</button>
    </div>
    <button id="screenshot-btn" style="width:100%; margin-top:0.75rem; padding:8px 12px; background:#fff; color:#000; border:none; border-radius:6px; cursor:pointer; font-size:13px; font-weight:500;">Download PNG</button>
  </div>
</div>
<script>
(() => {
  const params = {
    color1: '#3f655b',
    color2: '#6c938b',
    color3: '#9eb9b3',
    timeSpeed: 0.85,
    colorBalance: 0.0,
    warpStrength: 1.0,
    warpFrequency: 5.0,
    warpSpeed: 2.0,
    warpAmplitude: 50.0,
    blendAngle: 0.0,
    blendSoftness: 0.05,
    rotationAmount: 500.0,
    noiseScale: 2.0,
    grainAmount: 0.09,
    grainScale: 2.0,
    grainAnimated: false,
    contrast: 1.5,
    gamma: 1.0,
    saturation: 1.0,
    centerX: 0.0,
    centerY: 0.0,
    zoom: 0.9
  };

  const hexToRgb = hex => {
    const m = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
    if (!m) return [1, 1, 1];
    return [parseInt(m[1], 16) / 255, parseInt(m[2], 16) / 255, parseInt(m[3], 16) / 255];
  };

  const container = document.getElementById('grainient');
  const canvas = document.createElement('canvas');
  container.appendChild(canvas);
  const gl = canvas.getContext('webgl2', { alpha: true, antialias: false, premultipliedAlpha: true, preserveDrawingBuffer: true });
  if (!gl) { container.innerHTML = '<div style="color:#fff;padding:2rem">WebGL2 not supported.</div>'; return; }

  const vertexSrc = `#version 300 es
in vec2 position;
void main() { gl_Position = vec4(position, 0.0, 1.0); }`;

  const fragmentSrc = `#version 300 es
precision highp float;
uniform vec2 iResolution;
uniform float iTime;
uniform float uTimeSpeed;
uniform float uColorBalance;
uniform float uWarpStrength;
uniform float uWarpFrequency;
uniform float uWarpSpeed;
uniform float uWarpAmplitude;
uniform float uBlendAngle;
uniform float uBlendSoftness;
uniform float uRotationAmount;
uniform float uNoiseScale;
uniform float uGrainAmount;
uniform float uGrainScale;
uniform float uGrainAnimated;
uniform float uContrast;
uniform float uGamma;
uniform float uSaturation;
uniform vec2 uCenterOffset;
uniform float uZoom;
uniform vec3 uColor1;
uniform vec3 uColor2;
uniform vec3 uColor3;
out vec4 fragColor;
#define S(a,b,t) smoothstep(a,b,t)
mat2 Rot(float a){float s=sin(a),c=cos(a);return mat2(c,-s,s,c);}
vec2 hash(vec2 p){p=vec2(dot(p,vec2(2127.1,81.17)),dot(p,vec2(1269.5,283.37)));return fract(sin(p)*43758.5453);}
float noise(vec2 p){vec2 i=floor(p),f=fract(p),u=f*f*(3.0-2.0*f);float n=mix(mix(dot(-1.0+2.0*hash(i+vec2(0.0,0.0)),f-vec2(0.0,0.0)),dot(-1.0+2.0*hash(i+vec2(1.0,0.0)),f-vec2(1.0,0.0)),u.x),mix(dot(-1.0+2.0*hash(i+vec2(0.0,1.0)),f-vec2(0.0,1.0)),dot(-1.0+2.0*hash(i+vec2(1.0,1.0)),f-vec2(1.0,1.0)),u.x),u.y);return 0.5+0.5*n;}
void mainImage(out vec4 o, vec2 C){
  float t=iTime*uTimeSpeed;
  vec2 uv=C/iResolution.xy;
  float ratio=iResolution.x/iResolution.y;
  vec2 tuv=uv-0.5+uCenterOffset;
  tuv/=max(uZoom,0.001);
  float degree=noise(vec2(t*0.1,tuv.x*tuv.y)*uNoiseScale);
  tuv.y*=1.0/ratio;
  tuv*=Rot(radians((degree-0.5)*uRotationAmount+180.0));
  tuv.y*=ratio;
  float frequency=uWarpFrequency;
  float ws=max(uWarpStrength,0.001);
  float amplitude=uWarpAmplitude/ws;
  float warpTime=t*uWarpSpeed;
  tuv.x+=sin(tuv.y*frequency+warpTime)/amplitude;
  tuv.y+=sin(tuv.x*(frequency*1.5)+warpTime)/(amplitude*0.5);
  vec3 colLav=uColor1;
  vec3 colOrg=uColor2;
  vec3 colDark=uColor3;
  float b=uColorBalance;
  float s=max(uBlendSoftness,0.0);
  mat2 blendRot=Rot(radians(uBlendAngle));
  float blendX=(tuv*blendRot).x;
  float edge0=-0.3-b-s;
  float edge1=0.2-b+s;
  float v0=0.5-b+s;
  float v1=-0.3-b-s;
  vec3 layer1=mix(colDark,colOrg,S(edge0,edge1,blendX));
  vec3 layer2=mix(colOrg,colLav,S(edge0,edge1,blendX));
  vec3 col=mix(layer1,layer2,S(v0,v1,tuv.y));
  vec2 grainUv=C*max(uGrainScale,0.001)/1080.0;
  if(uGrainAnimated>0.5){grainUv+=vec2(iTime*0.05);}
  float grain=fract(sin(dot(grainUv,vec2(12.9898,78.233)))*43758.5453);
  col+=(grain-0.5)*uGrainAmount;
  col=(col-0.5)*uContrast+0.5;
  float luma=dot(col,vec3(0.2126,0.7152,0.0722));
  col=mix(vec3(luma),col,uSaturation);
  col=pow(max(col,0.0),vec3(1.0/max(uGamma,0.001)));
  col=clamp(col,0.0,1.0);
  o=vec4(col,1.0);
}
void main(){ vec4 o=vec4(0.0); mainImage(o,gl_FragCoord.xy); fragColor=o; }`;

  const compile = (type, src) => {
    const sh = gl.createShader(type);
    gl.shaderSource(sh, src);
    gl.compileShader(sh);
    if (!gl.getShaderParameter(sh, gl.COMPILE_STATUS)) {
      console.error(gl.getShaderInfoLog(sh));
    }
    return sh;
  };
  const program = gl.createProgram();
  gl.attachShader(program, compile(gl.VERTEX_SHADER, vertexSrc));
  gl.attachShader(program, compile(gl.FRAGMENT_SHADER, fragmentSrc));
  gl.bindAttribLocation(program, 0, 'position');
  gl.linkProgram(program);
  gl.useProgram(program);

  // Fullscreen triangle
  const vao = gl.createVertexArray();
  gl.bindVertexArray(vao);
  const buf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
  gl.enableVertexAttribArray(0);
  gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);

  const U = {};
  const names = ['iResolution','iTime','uTimeSpeed','uColorBalance','uWarpStrength','uWarpFrequency','uWarpSpeed','uWarpAmplitude','uBlendAngle','uBlendSoftness','uRotationAmount','uNoiseScale','uGrainAmount','uGrainScale','uGrainAnimated','uContrast','uGamma','uSaturation','uCenterOffset','uZoom','uColor1','uColor2','uColor3'];
  names.forEach(n => U[n] = gl.getUniformLocation(program, n));

  const c1 = hexToRgb(params.color1), c2 = hexToRgb(params.color2), c3 = hexToRgb(params.color3);
  gl.uniform1f(U.uTimeSpeed, params.timeSpeed);
  gl.uniform1f(U.uColorBalance, params.colorBalance);
  gl.uniform1f(U.uWarpStrength, params.warpStrength);
  gl.uniform1f(U.uWarpFrequency, params.warpFrequency);
  gl.uniform1f(U.uWarpSpeed, params.warpSpeed);
  gl.uniform1f(U.uWarpAmplitude, params.warpAmplitude);
  gl.uniform1f(U.uBlendAngle, params.blendAngle);
  gl.uniform1f(U.uBlendSoftness, params.blendSoftness);
  gl.uniform1f(U.uRotationAmount, params.rotationAmount);
  gl.uniform1f(U.uNoiseScale, params.noiseScale);
  gl.uniform1f(U.uGrainAmount, params.grainAmount);
  gl.uniform1f(U.uGrainScale, params.grainScale);
  gl.uniform1f(U.uGrainAnimated, params.grainAnimated ? 1.0 : 0.0);
  gl.uniform1f(U.uContrast, params.contrast);
  gl.uniform1f(U.uGamma, params.gamma);
  gl.uniform1f(U.uSaturation, params.saturation);
  gl.uniform2f(U.uCenterOffset, params.centerX, params.centerY);
  gl.uniform1f(U.uZoom, params.zoom);
  gl.uniform3f(U.uColor1, c1[0], c1[1], c1[2]);
  gl.uniform3f(U.uColor2, c2[0], c2[1], c2[2]);
  gl.uniform3f(U.uColor3, c3[0], c3[1], c3[2]);

  // Always render backing = CSS-size × device-dpr so fragment ≈ device pixel.
  // This keeps grain density identical between fit-window and preset modes.
  const baseDpr = Math.min(window.devicePixelRatio || 1, 2);
  const resize = () => {
    const rect = container.getBoundingClientRect();
    const w = Math.max(1, Math.round(rect.width * baseDpr));
    const h = Math.max(1, Math.round(rect.height * baseDpr));
    if (canvas.width !== w || canvas.height !== h) {
      canvas.width = w; canvas.height = h;
    }
    gl.viewport(0, 0, w, h);
    gl.uniform2f(U.iResolution, w, h);
  };
  window.addEventListener('resize', resize);
  resize();

  const t0 = performance.now();
  let running = true;
  const frame = t => {
    if (!running) return;
    gl.uniform1f(U.iTime, (t - t0) * 0.001);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
    requestAnimationFrame(frame);
  };
  requestAnimationFrame(frame);

  document.addEventListener('visibilitychange', () => {
    if (document.hidden) { running = false; }
    else if (!running) { running = true; requestAnimationFrame(frame); }
  });

  // --- Settings UI wiring ---
  const panel = document.getElementById('settings-panel');
  document.getElementById('settings-toggle').addEventListener('click', () => {
    panel.classList.toggle('open');
  });

  const overlayBtn = document.getElementById('overlay-toggle');
  const contentEl = document.getElementById('content');
  overlayBtn.addEventListener('click', () => {
    const hidden = contentEl.classList.toggle('hidden');
    overlayBtn.textContent = hidden ? 'Show' : 'Hide';
  });

  const bindColor = (id, uniform) => {
    document.getElementById(id).addEventListener('input', e => {
      const rgb = hexToRgb(e.target.value);
      gl.useProgram(program);
      gl.uniform3f(uniform, rgb[0], rgb[1], rgb[2]);
    });
  };
  bindColor('c1', U.uColor1);
  bindColor('c2', U.uColor2);
  bindColor('c3', U.uColor3);

  const bindSlider = (id, uniform, decimals = 2) => {
    const input = document.getElementById(id);
    const val = document.getElementById(id + 'Val');
    input.addEventListener('input', e => {
      const v = parseFloat(e.target.value);
      val.textContent = v.toFixed(decimals);
      gl.useProgram(program);
      gl.uniform1f(uniform, v);
    });
  };
  bindSlider('grainAmount', U.uGrainAmount, 2);
  bindSlider('grainScale', U.uGrainScale, 1);
  bindSlider('noiseScale', U.uNoiseScale, 1);

  const sizeLabel = document.getElementById('size-label');
  document.getElementById('sizePreset').addEventListener('change', e => {
    const v = e.target.value;
    if (v === 'fit') {
      container.classList.remove('sized');
      container.style.width = '100vw';
      container.style.height = '100vh';
    } else {
      const [w, h] = v.split('x').map(Number);
      container.classList.add('sized');
      // CSS = preset / dpr so the backing store (× dpr) lands on exact preset px.
      // OS screenshots capture at device pixels → exactly W × H.
      container.style.width = (w / baseDpr) + 'px';
      container.style.height = (h / baseDpr) + 'px';
      sizeLabel.textContent = `${w} × ${h}`;
    }
    requestAnimationFrame(resize);
  });

  document.getElementById('screenshot-btn').addEventListener('click', () => {
    // Force a fresh render so the buffer reflects current uniforms.
    gl.uniform1f(U.iTime, (performance.now() - t0) * 0.001);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
    canvas.toBlob(blob => {
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      const preset = document.getElementById('sizePreset').value;
      const dims = preset === 'fit' ? `${canvas.width}x${canvas.height}` : preset;
      a.href = url;
      a.download = `grainient-basalt-${dims}.png`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    }, 'image/png');
  });
})();
</script>
</body>
</html>
